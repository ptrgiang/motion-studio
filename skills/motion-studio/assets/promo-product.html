<!doctype html><html lang="en"><meta charset="utf-8"><title>Motion Notes — local demo app</title>
<style>@font-face{font-family:MotionFont;src:url('../assets/fonts/MotionFont.ttf')}*{box-sizing:border-box}body{margin:0;background:#eef1ea;color:#1c352c;font:20px MotionFont,sans-serif;padding:40px}body.dark{background:#172d27;color:#f0f4eb}#app{max-width:880px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:35px}h1{font-size:36px;margin:0}small{display:block;color:#6b8276;font-size:14px;margin-top:8px}button{border:0;border-radius:14px;padding:14px 22px;font:inherit;cursor:pointer;background:#244b3e;color:white}#theme{background:#dbe5d7;color:#244b3e}section{padding:30px;background:white;border-radius:22px;box-shadow:0 8px 30px #14291d12}.dark section{background:#244239}label{display:block;margin-bottom:12px}textarea{resize:none;width:100%;height:150px;background:#f5f7f0;border:1px solid #ccd8c9;border-radius:12px;padding:18px;font:inherit;color:#1c352c;margin-bottom:20px}#feedback{display:inline-block;margin-left:20px;font-size:16px}#notes{padding:0;list-style:none}li{margin-top:20px;padding:25px;border:1px solid #91ac9b;border-radius:16px;overflow-wrap:anywhere}footer{font-size:14px;margin-top:24px;color:#6b8276}</style>
<div id="app"><header><div><h1>Motion Notes</h1><small>Original working app for a renderer demonstration</small></div><button id="theme">Dark view</button></header><section><label for="note">A thought to keep</label><textarea id="note" placeholder="Write one small idea…"></textarea><button id="save">Save note</button><span id="feedback" role="status">Ready</span></section><ul id="notes"></ul><footer>Notes stay in this browser. This is a local sample, with no external service.</footer></div>
<script>
const input=document.querySelector('#note'),list=document.querySelector('#notes'),status=document.querySelector('#feedback');
const notes=JSON.parse(localStorage.getItem('motion-notes')||'[]');
function paint(){list.replaceChildren();notes.forEach(text=>{const li=document.createElement('li');li.textContent=text;list.append(li);});}paint();
document.querySelector('#save').onclick=()=>{if(!input.value.trim()){status.textContent='Write a note first';return;}notes.push(input.value.trim());localStorage.setItem('motion-notes',JSON.stringify(notes));paint();status.textContent='Saved';input.value='';};
document.querySelector('#theme').onclick=()=>{const dark=document.body.classList.toggle('dark');document.querySelector('#theme').textContent=dark?'Light view':'Dark view';};
</script></html>
